name: trendvn
# Two containers (n8n + worker). The browser agent (Chrome) runs on the host, not here: see docs/ARCHITECTURE.md.
# Every deployment-specific value comes from .env (see .env.example); the defaults keep everything on this machine only.
# Use ./trendvn (up, down, logs, build...) instead of typing docker compose by hand.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"      # container logs rotate: at most 5 x 10 MB per service, so they can never fill the disk
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  n8n:
    <<: *hardening
    image: docker.n8n.io/n8nio/n8n:2.38.7          # pinned: workflows in n8n/workflows are built and tested against this version
    ports:
      - "${TRENDVN_BIND:-127.0.0.1}:${TRENDVN_N8N_PORT:-5680}:5678"
    environment:
      TZ: ${TRENDVN_TZ:-Asia/Ho_Chi_Minh}
      GENERIC_TIMEZONE: ${TRENDVN_TZ:-Asia/Ho_Chi_Minh}
      N8N_HOST: ${TRENDVN_N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${TRENDVN_N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${TRENDVN_N8N_URL:-http://localhost:5680}
      WEBHOOK_URL: ${TRENDVN_N8N_URL:-http://localhost:5680}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Chưa có .env - hãy chạy ./trendvn install}
      N8N_SECURE_COOKIE: ${TRENDVN_N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 1
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/import:ro                   # generated by ./trendvn n8n build, loaded by ./trendvn n8n import
    extra_hosts:
      # Linux: the private bridge gateway (the host agent listens there). macOS/Windows Docker Desktop: setup writes "host-gateway".
      - "trendvn-agent:${TRENDVN_AGENT_HOSTREF:-172.20.0.1}"
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    <<: *hardening
    image: trendvn/worker:${TRENDVN_VERSION:-dev}
    build:
      context: ./services/worker
      args:
        VERSION: ${TRENDVN_VERSION:-dev}
    user: "${TRENDVN_UID:-1000}:${TRENDVN_GID:-1000}"
    init: true
    cap_drop: [ALL]
    read_only: true                                   # the image is immutable; everything the worker writes goes to /data or /tmp
    tmpfs:
      - /tmp:size=512m
    stop_grace_period: 30s
    ports:
      - "${TRENDVN_BIND:-127.0.0.1}:${TRENDVN_WORKER_PORT:-5681}:8080"
    environment:
      TZ: ${TRENDVN_TZ:-Asia/Ho_Chi_Minh}
      TRENDVN_TOKEN: ${TRENDVN_TOKEN:?Chưa có .env - hãy chạy ./trendvn install}
      TRENDVN_DATA: /data
      TRENDVN_PUBLIC_PORT: ${TRENDVN_WORKER_PORT:-5681}
      TRENDVN_AGENT_PORT: ${TRENDVN_AGENT_PORT:-5682}
      TRENDVN_N8N_PORT: ${TRENDVN_N8N_PORT:-5680}
      TRENDVN_PROCESS_PARALLEL: ${TRENDVN_PROCESS_PARALLEL:-2}
      TRENDVN_UI_HOSTS: ${TRENDVN_UI_HOSTS:-}
      TRENDVN_UI_PASSWORD: ${TRENDVN_UI_PASSWORD:-}
      TRENDVN_TELEGRAM_TOKEN: ${TRENDVN_TELEGRAM_TOKEN:-}
      TRENDVN_TELEGRAM_CHAT: ${TRENDVN_TELEGRAM_CHAT:-}
      TRENDVN_NOTIFY_WEBHOOK: ${TRENDVN_NOTIFY_WEBHOOK:-}
      TRENDVN_NTFY_URL: ${TRENDVN_NTFY_URL:-}
    volumes:
      - ./data/worker:/data                           # SQLite queue, videos, Gemini key: the state worth backing up
    extra_hosts:
      - "trendvn-agent:${TRENDVN_AGENT_HOSTREF:-172.20.0.1}"     # the dashboard buttons call the browser agent on the host
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  private:
    ipam:
      config:
        - subnet: ${TRENDVN_SUBNET:-172.20.0.0/16}
          gateway: ${TRENDVN_GATEWAY:-172.20.0.1}

volumes:
  n8n_data:
