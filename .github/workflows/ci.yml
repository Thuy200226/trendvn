# The same gate as on the owner's machine: `./trendvn test` = lint (ruff, black, shellcheck, doc-lint, n8n build check) + unit tests.
# NOT YET RUN on GitHub: this repository lives on one machine today. What was verified: the file parses, and `./trendvn test lint` plus the
# 373 unit tests pass in a clean copy of the tracked files (no .env, no data/), which is all this job needs. The container and browser tiers (`./trendvn test container`, `./trendvn test e2e`) need Docker and Chrome and stay manual.
# Actions are pinned to full commit SHAs (taken with `git ls-remote --tags` on 2026-10-02); update them deliberately.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Pinned dev tools (black, ruff, shellcheck)
        run: python -m pip install -r requirements-dev.txt
      - name: Install ffmpeg (the media tests skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Quality gate (same command as local)
        run: ./trendvn test
